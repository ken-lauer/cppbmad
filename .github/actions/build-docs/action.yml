name: Build docs
description: >
  Build mkdocs site. Expects pybmad to already be installed
  (or the shared lib available on PYTHONPATH).

inputs:
  output_dir:
    description: "Directory to write the built docs site"
    required: false
    default: docs-site

outputs:
  success:
    description: "'true' if the docs built successfully, 'false' otherwise"
    value: ${{ steps.build.outputs.success }}

runs:
  using: composite
  steps:
    - name: Install docs dependencies
      shell: bash -eo pipefail -l {0}
      run: python -m pip install mkdocs mkdocstrings[python] mkdocs-autorefs pymdown-extensions

    - name: Copy installed pybmad into source tree for griffe
      shell: bash -eo pipefail -l {0}
      run: |
        site_pkg=$(python -c "import pybmad; print(pybmad.__path__[0])")
        cp -f "$site_pkg"/_pybmad*.so python/pybmad/
        echo "$site_pkg -> $PWD/python/pybmad"

    - name: Build mkdocs site
      id: build
      shell: bash -eo pipefail -l {0}
      run: |
        if mkdocs build -f python/docs/mkdocs.yml -d "${{ inputs.output_dir }}"; then
          echo "success=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::mkdocs build failed — docs will not be deployed"
          echo "## ⚠️ Docs build failed!" >> "$GITHUB_STEP_SUMMARY"
          echo "success=false" >> "$GITHUB_OUTPUT"
        fi
