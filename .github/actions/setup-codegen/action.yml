name: Set up codegen
description: >
  Check out the Bmad ecosystem source at a given ref and install the Python and
  clang-format dependencies needed to run `python -m codegen`. Does NOT build
  Bmad — code generation only parses Fortran source. Exports ACC_ROOT_DIR for
  subsequent steps in the same job.

inputs:
  bmad_ref:
    description: "Bmad ecosystem git ref to generate against"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: bmad-sim/bmad-ecosystem
        ref: ${{ inputs.bmad_ref }}
        path: bmad_src

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install codegen dependencies
      shell: bash
      # clang-format pinned to match .pre-commit-config.yaml so generated C++
      # formatting is identical to what maintainers commit.
      run: python -m pip install --upgrade pydantic "clang-format==21.1.8"

    - name: Export ACC_ROOT_DIR
      shell: bash
      run: echo "ACC_ROOT_DIR=$GITHUB_WORKSPACE/bmad_src" >> "$GITHUB_ENV"
