name: Build pybmad
description: >
  Regenerate bindings, build and install the pybmad wheel (scikit-build-core
  recompiles cppbmad as part of this), and run the Python tests. Requires a
  prior build-bmad step in the same job (conda env activated and ACC_ROOT_DIR
  exported).

inputs:
  build_type:
    description: "Bmad build type (release or debug) used to locate its libraries"
    required: false
    default: release
  run_tests:
    description: "Run Python tests after building"
    required: false
    default: "true"
  upload_wheel:
    description: "Upload the built pybmad wheel as an artifact"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash -eo pipefail -l {0}
      run: conda install -y cmake pydantic clang-format

    - name: Regenerate bindings
      shell: bash -eo pipefail -l {0}
      run: python -m codegen

    - name: Build pybmad wheel
      shell: bash -eo pipefail -l {0}
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          CMAKE_BUILD_PARALLEL_LEVEL=1 python -m pip wheel --no-deps -w dist .
        else
          python -m pip wheel -vv --no-deps -w dist .
        fi

    - name: Install pybmad from wheel
      shell: bash -eo pipefail -l {0}
      run: python -m pip install -vv dist/*.whl

    - name: Upload pybmad wheel
      if: inputs.upload_wheel == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pybmad-wheel
        path: dist/*.whl

    - name: Set library search path
      shell: bash -l {0}
      run: |
        if [[ "${{ inputs.build_type }}" == "release" ]]; then
          BMAD_BUILD_TYPE="production"
        else
          BMAD_BUILD_TYPE="${{ inputs.build_type }}"
        fi
        lib_path="$ACC_ROOT_DIR/$BMAD_BUILD_TYPE/lib"
        echo "LD_LIBRARY_PATH=$lib_path:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

    - name: Run Python examples
      if: inputs.run_tests == 'true'
      shell: bash -eo pipefail -l {0}
      working-directory: python/examples
      run: bash run_examples.sh

    - name: Run Python test suite
      if: inputs.run_tests == 'true'
      shell: bash -eo pipefail -l {0}
      working-directory: python/examples
      run: python -m pytest python/tests/
