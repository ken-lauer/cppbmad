name: Track upstream releases

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Specific upstream tag to process (leave empty for latest)"
        required: false
        type: string

concurrency:
  group: track-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: bmad-sim/bmad-ecosystem
  FEEDSTOCK_REPO: conda-forge/cppbmad-feedstock

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.upstream_tag }}" ]]; then
            UPSTREAM_TAG="${{ inputs.upstream_tag }}"
          else
            UPSTREAM_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')
          fi
          echo "Latest upstream tag: $UPSTREAM_TAG"

          if git tag -l "$UPSTREAM_TAG" | grep -q .; then
            echo "Tag $UPSTREAM_TAG already exists, nothing to do"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected: $UPSTREAM_TAG"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          fi

  regenerate:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    environment: auto-regen
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash -eo pipefail -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOGENERATE_PAT }}

      - uses: ./.github/actions/build-bmad
        with:
          bmad_ref: ${{ needs.check-release.outputs.upstream_tag }}
          build_type: release
          upload_wheel: "true"

      - name: Commit regenerated files, tag, and release
        env:
          UPSTREAM_TAG: ${{ needs.check-release.outputs.upstream_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add $(bash list-generated.sh)

          if git diff --cached --quiet; then
            echo "No changes to generated files"
          else
            git commit -m "MAINT: regenerate for Bmad $UPSTREAM_TAG"
          fi

          git tag -a "$UPSTREAM_TAG" -m "Release $UPSTREAM_TAG"
          git push origin HEAD "$UPSTREAM_TAG"

      - uses: ./.github/actions/build-docs
        with:
          output_dir: ${{ github.workspace }}/docs-site

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

      # - name: Trigger conda-forge feedstock rerender

  deploy-docs:
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
