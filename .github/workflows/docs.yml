name: Build and deploy docs

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs
        env:
          PYTHONPATH: python
        run: |
          python -m pip install mkdocs mkdocstrings[python] pymdown-extensions
          mkdocs build -f python/docs/mkdocs.yml -d $GITHUB_WORKSPACE/docs-site
          cp coverage.html $GITHUB_WORKSPACE/docs-site/coverage.html

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
