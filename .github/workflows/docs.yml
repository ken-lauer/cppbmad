name: Build and deploy docs

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bmad_ref:
        description: "Bmad ecosystem git ref"
        required: false
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-bmad
        with:
          bmad_ref: ${{ inputs.bmad_ref || 'main' }}
          run_tests: "false"

      - uses: ./.github/actions/build-docs
        with:
          output_dir: ${{ github.workspace }}/docs-site

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
