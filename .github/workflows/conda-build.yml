name: Conda build & test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-conda:
    name: ${{ matrix.target }} / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash
    # Constants shared by every matrix entry; override per-platform below.
    env:
      SHARED: Y
      BMAD_REF: main
      BUILD_TYPE: release
    strategy:
      fail-fast: false
      matrix:
        target: [cppbmad, pybmad]
        platform:
          - name: linux
            os: ubuntu-latest
            openmp_mpi: N
            upload_wheel: true
          - name: macos
            os: macos-latest
            openmp_mpi: N
            upload_wheel: false
          - name: linux-openmp-mpi
            os: ubuntu-latest
            openmp_mpi: Y
            upload_wheel: false

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-bmad
        with:
          bmad_ref: ${{ env.BMAD_REF }}
          shared: ${{ env.SHARED }}
          openmp_mpi: ${{ matrix.platform.openmp_mpi }}
          build_type: ${{ env.BUILD_TYPE }}

      - uses: ./.github/actions/build-cppbmad
        if: matrix.target == 'cppbmad'
        with:
          build_type: ${{ env.BUILD_TYPE }}

      - uses: ./.github/actions/build-pybmad
        if: matrix.target == 'pybmad'
        with:
          build_type: ${{ env.BUILD_TYPE }}
          upload_wheel: ${{ matrix.platform.upload_wheel && 'true' || 'false' }}

      - uses: ./.github/actions/build-docs
        id: docs
        if: matrix.target == 'pybmad' && matrix.platform.upload_wheel
        with:
          output_dir: ${{ github.workspace }}/docs-site

      - name: Upload docs artifact
        if: matrix.target == 'pybmad' && matrix.platform.upload_wheel && steps.docs.outputs.success == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy-docs:
    needs: build-conda
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
