site_name: pybmad
site_url: https://ken-lauer.github.io/cppbmad/
repo_url: https://github.com/ken-lauer/cppbmad
repo_name: ken-lauer/cppbmad
docs_dir: source
use_directory_urls: false

nav:
  - Home: index.md
  - Examples: examples.md
  - API Reference:
      - Index: api/index.md
      - Bmad: api/bmad.md
      - Sim Utils: api/sim_utils.md
      - Tao: api/tao.md
      - Bsim: api/bsim.md
      - Forest / PTC: api/forest.md
      - Enums: api/enums.md

theme:
  icon:
    repo: fontawesome/brands/github
  name: readthedocs

  features:
    - navigation.top
    - navigation.tabs
    - navigation.indexes

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["../.."]
      check_paths: true
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  # The following are for mathjax rendering of LaTeX formulas:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ken-lauer/cppbmad
      name: pybmad

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - autorefs

  # - mkdocs-jupyter:
  #     include_source: True

  - mkdocstrings:
      default_handler: python
      custom_templates: overrides
      handlers:
        python:
          # With this, pybmad is never found in site-packages and Griffe may fail on
          # locating the first overloaded function (attribute_free typically).
          # For local docs building without a pip install, uncomment this:
          # paths: [".."] # resolves to python/ so griffe finds pybmad + _pybmad.pyi
          options:
            extensions:
              # Expose overload-only functions that griffe otherwise drops when
              # a .pyi stub has no implementation def.
              - griffe_expose_overloads.py
            filters:
              - "!^_" # exclude all members starting with _
              - "^__init__$" # but always include __init__ modules and methods
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: false
            heading_level: 3
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: true
            show_root_members_full_path: false
            show_object_full_path: true
            show_category_heading: true
            show_if_no_docstring: false
            show_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 100
            merge_init_into_class: true
            show_source: false
            show_bases: true
            show_submodules: false
            group_by_category: true
            unwrap_annotated: true
            force_inspection: false
            allow_inspection: true
            # overloads
            show_overloads: true
            overloads_only: true
